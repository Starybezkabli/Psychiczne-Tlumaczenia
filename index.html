<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>Ultimate Reader+ MAX</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getDatabase, ref, set, onValue, push, remove, increment } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";
import { getAuth, onAuthStateChanged, createUserWithEmailAndPassword, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
import { getStorage, ref as sRef, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-storage.js";

const firebaseConfig={
 apiKey:"API_KEY",
 authDomain:"psychicznetlumaczenia-34d74.firebaseapp.com",
 databaseURL:"https://psychicznetlumaczenia-34d74-default-rtdb.firebaseio.com/",
 projectId:"psychicznetlumaczenia-34d74",
 storageBucket:"psychicznetlumaczenia-34d74.appspot.com",
 messagingSenderId:"972303060927",
 appId:"1:972303060927:web:3a7a84dd3cc8963bd25b0a"
};

const app=initializeApp(firebaseConfig);

window.db=getDatabase(app);
window.auth=getAuth(app);
window.storage=getStorage(app);

window.ref=ref;
window.set=set;
window.onValue=onValue;
window.push=push;
window.remove=remove;
window.increment=increment;

window.sRef=sRef;
window.uploadBytes=uploadBytes;
window.getDownloadURL=getDownloadURL;

window.createUser=createUserWithEmailAndPassword;
window.signInUser=signInWithEmailAndPassword;
window.onAuthChanged=onAuthStateChanged;

window.ready=true;
</script>

<style>
body{margin:0;font-family:system-ui}
.dark{background:#0b0016;color:#e9d5ff}
.light{background:#f5f5f5;color:#111}
header{background:#6d28d9;padding:10px;color:white;display:flex;gap:6px;flex-wrap:wrap}
button{background:#9333ea;color:white;border:none;padding:6px;border-radius:6px;cursor:pointer}
.card{padding:10px;margin:10px 0;border-radius:8px}
.dark .card{background:#1a0033}
.light .card{background:white}
.readerOverlay{position:fixed;inset:0;background:black;color:white;overflow:auto;z-index:999}
.reader img{width:100%}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.tag{display:inline-block;padding:4px 8px;margin:4px;border-radius:6px;background:#3b0764;cursor:pointer}
.activeTag{background:#9333ea}
input{padding:6px;margin:4px 0;width:100%}
.chatBox{height:200px;overflow:auto;background:#111;padding:6px;margin-bottom:6px}
</style>
</head>

<body>
<div id="root"></div>

<script>
function wait(cb){ if(window.ready)cb(); else setTimeout(()=>wait(cb),50); }
wait(start);

function start(){
const e=React.createElement;

/* ===== HOOK DB ===== */
function useDB(path,init){
 const[d,setD]=React.useState(init);
 React.useEffect(()=>{
  if(!path) return;
  const r=window.ref(window.db,path);
  window.onValue(r,s=>{
   if(s.exists()) setD(s.val());
   else window.set(r,init);
  });
 },[path]);
 const save=v=>{
  const val=typeof v==="function"?v(d):v;
  setD(val);
  window.set(window.ref(window.db,path),val);
 };
 return[d,save];
}

function useAuth(){
 const[u,setU]=React.useState(null);
 React.useEffect(()=>window.onAuthChanged(window.auth,setU),[]);
 return u;
}

/* ===== TAGI ===== */
const TAGS=["yaoi","yuri","hetero","romans","akcja","horror","fantasy","szkolne","drama","dla dorosłych"];

/* ===== APP ===== */
function App(){

const user=useAuth();
const [series,setSeries]=useDB("series",[]);
const [admins,setAdmins]=useDB("admins",[]);
const [favorites,setFavorites]=useDB(user?`users/${user.uid}/fav`:"tmp",[]);
const [theme,setTheme]=useDB(user?`users/${user.uid}/theme`:"tmp2","dark");
const [view,setView]=React.useState("home");
const [active,setActive]=React.useState(null);
const [reader,setReader]=React.useState(null);
const [page,setPage]=React.useState(0);
const [search,setSearch]=React.useState("");
const [tagFilter,setTagFilter]=React.useState([]);

const isAdmin=user && admins.includes(user.uid);

React.useEffect(()=>{
 if(user && admins.length===0) setAdmins([user.uid]);
},[user,admins]);

/* ===== FILTR ===== */
const filtered=(series||[]).filter(s=>{
 const t=s.title.toLowerCase().includes(search.toLowerCase());
 const tags=tagFilter.length===0 || tagFilter.every(tag=>s.tags?.includes(tag));
 return t && tags;
});

/* ===== DODAJ SERIE ===== */
function addSeries(){
 const title=prompt("Tytuł:");
 if(!title)return;
 const tags=prompt("Tagi (przecinek):");
 const obj={id:Date.now(),title,tags:tags?tags.split(",").map(x=>x.trim()):[],chapters:[]};
 setSeries([...series,obj]);
}

/* ===== DODAJ ROZDZIAŁ ===== */
function addChapter(s){
 const title=prompt("Tytuł:");
 if(!title)return;
 const input=document.createElement("input");
 input.type="file"; input.multiple=true; input.accept="image/*";
 input.onchange=async ()=>{
  const files=[...input.files];
  const urls=[];
  for(let f of files){
   const storageRef=window.sRef(window.storage,"chapters/"+Date.now()+f.name);
   await window.uploadBytes(storageRef,f);
   const url=await window.getDownloadURL(storageRef);
   urls.push(url);
  }
  const chapter={id:Date.now(),title,images:urls,views:0};
  setSeries(prev=>prev.map(x=>x.id===s.id?{...x,chapters:[...x.chapters,chapter]}:x));
 };
 input.click();
}

/* ===== READER ===== */
function Reader(){
 React.useEffect(()=>{
  window.set(window.ref(window.db,`series/${series.indexOf(active)}/chapters/${active.chapters.indexOf(reader)}/views`), reader.views+1);
 },[]);
 return e("div",{className:"readerOverlay"},
  e("button",{onClick:()=>setReader(null)},"Zamknij"),
  e("div",null,
   e("button",{onClick:()=>setPage(p=>Math.max(p-1,0))},"◀"),
   " "+(page+1)+" / "+reader.images.length+" ",
   e("button",{onClick:()=>setPage(p=>Math.min(p+1,reader.images.length-1))},"▶")
  ),
  e("img",{src:reader.images[page]}),
  e(Comments)
 );
}

/* ===== KOMENTARZE ===== */
function Comments(){
 const [comments,setComments]=useDB(`comments/${reader.id}`,[]);
 const [text,setText]=React.useState("");
 return e("div",{className:"card"},
  e("h3",null,"Komentarze"),
  comments.map((c,i)=>e("div",{key:i},c.user+": "+c.text)),
  user && e("div",null,
   e("input",{value:text,onChange:e=>setText(e.target.value)}),
   e("button",{onClick:()=>{
    setComments([...comments,{user:user.email,text}]);
    setText("");
   }},"Wyślij")
  )
 );
}

/* ===== CHAT ===== */
function Chat(){
 const [msgs,setMsgs]=useDB("chat",[]);
 const [msg,setMsg]=React.useState("");
 return e("div",{className:"card"},
  e("h3",null,"Czat"),
  e("div",{className:"chatBox"},
   msgs.map((m,i)=>e("div",{key:i},m.user+": "+m.text))
  ),
  user && e("div",null,
   e("input",{value:msg,onChange:e=>setMsg(e.target.value)}),
   e("button",{onClick:()=>{
    setMsgs([...msgs,{user:user.email,text:msg}]);
    setMsg("");
   }},"Wyślij")
  )
 );
}

/* ===== RENDER ===== */
return e("div",{className:theme},
 e("header",null,
  e("button",{onClick:()=>setView("home")},"Home"),
  e("button",{onClick:()=>setView("login")},"Login"),
  user && e("button",{onClick:()=>setTheme(theme==="dark"?"light":"dark")},"🌗")
 ),
 view==="home" && e("div",null,
  e("input",{placeholder:"Szukaj...",value:search,onChange:e=>setSearch(e.target.value)}),
  TAGS.map(tag=>
   e("span",{key:tag,className:"tag "+(tagFilter.includes(tag)?"activeTag":""),onClick:()=>{
    setTagFilter(tagFilter.includes(tag)?tagFilter.filter(t=>t!==tag):[...tagFilter,tag]);
   }},tag)
  ),
  isAdmin && e("button",{onClick:addSeries},"Dodaj serię"),
  e("div",{className:"grid"},
   filtered.map(s=>
    e("div",{key:s.id,className:"card"},
     e("b",{onClick:()=>{setActive(s);setView("series");}},s.title),
     e("div",null,(s.tags||[]).join(", ")),
     user && e("button",{onClick:()=>{
      setFavorites(favorites.includes(s.id)?favorites.filter(id=>id!==s.id):[...favorites,s.id]);
     }},favorites.includes(s.id)?"★":"☆")
    )
   )
  ),
  e(Chat)
 ),
 view==="series" && active && e("div",{className:"card"},
  e("h2",null,active.title),
  active.chapters.map(ch=>
   e("div",{key:ch.id},
    e("button",{onClick:()=>{setReader(ch);setPage(0);}},ch.title),
    " (",ch.views||0," wyświetleń)"
   )
  ),
  isAdmin && e("button",{onClick:()=>addChapter(active)},"Dodaj rozdział")
 ),
 view==="login" && e("div",{className:"card"},
  e("input",{id:"mail",placeholder:"Email"}),
  e("input",{id:"pass",type:"password",placeholder:"Hasło"}),
  e("button",{onClick:()=>{
   const m=document.getElementById("mail").value;
   const p=document.getElementById("pass").value;
   window.createUser(window.auth,m,p)
   .catch(()=>window.signInUser(window.auth,m,p));
  }},"Zaloguj")
 ),
 reader && e(Reader)
);
}

ReactDOM.createRoot(document.getElementById("root")).render(e(App));
}
</script>
</body>
</html>
