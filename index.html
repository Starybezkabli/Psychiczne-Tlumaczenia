<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PSYCHIATRYK</title>

<style>
body{
    margin:0;
    font-family:Arial, Helvetica, sans-serif;
    background:linear-gradient(135deg,#0d001a,#1a0033,#120022);
    color:white;
}

header{
    background:#2a004d;
    padding:25px;
    text-align:center;
    font-size:32px;
    font-weight:bold;
    letter-spacing:3px;
    color:#d9b3ff;
    box-shadow:0 0 20px #8000ff;
}

.container{
    padding:20px;
}

.search-box{
    text-align:center;
    margin-bottom:30px;
}

.search-box input{
    width:320px;
    padding:12px;
    font-size:16px;
    border:none;
    border-radius:8px;
    background:#2a004d;
    color:white;
    outline:none;
    box-shadow:0 0 10px #8000ff;
}

.grid{
    display:flex;
    flex-wrap:wrap;
    gap:25px;
    justify-content:center;
}

.card{
    background:#1f0033;
    width:220px;
    border-radius:15px;
    overflow:hidden;
    cursor:pointer;
    transition:0.3s;
    box-shadow:0 0 15px rgba(128,0,255,0.4);
}

.card:hover{
    transform:scale(1.05);
    box-shadow:0 0 25px #b366ff;
}

.card img{
    width:100%;
    height:300px;
    object-fit:cover;
}

.card h3{
    padding:10px;
    margin:0;
    font-size:18px;
    color:#e6ccff;
}

.tags{
    padding:0 10px 15px 10px;
    font-size:12px;
    color:#b366ff;
}

.hidden{ display:none; }

button{
    background:#8000ff;
    color:white;
    border:none;
    padding:10px 15px;
    cursor:pointer;
    margin-top:15px;
    border-radius:6px;
}

button:hover{ background:#a64dff; }

.chapter-list div{
    background:#2a004d;
    padding:12px;
    margin:8px 0;
    cursor:pointer;
    border-radius:6px;
}

.chapter-list div:hover{
    background:#3d0066;
}

.reader img{
    width:90%;
    margin:20px auto;
    display:block;
    border-radius:10px;
    box-shadow:0 0 20px rgba(128,0,255,0.5);
}

/* ZESPÓŁ */

.team{
    margin-top:60px;
    text-align:center;
}

.team-grid{
    display:flex;
    justify-content:center;
    gap:30px;
    flex-wrap:wrap;
    margin-top:20px;
}

.member{
    background:#1f0033;
    padding:20px;
    border-radius:15px;
    width:220px;
    box-shadow:0 0 15px rgba(128,0,255,0.4);
}

.member img{
    width:100px;
    height:100px;
    border-radius:50%;
    object-fit:cover;
    margin-bottom:10px;
}

footer{
    margin-top:60px;
    text-align:center;
    padding:20px;
}

footer a{
    color:#d9b3ff;
    font-size:18px;
    text-decoration:none;
}

footer a:hover{
    text-decoration:underline;
}
</style>
</head>
<body>

<header>PSYCHIATRYK</header>

<div class="container">

<div id="home">

    <div class="search-box">
        <input type="text" id="searchInput" placeholder="Szukaj po tytule lub tagach..." onkeyup="searchManga()">
    </div>

    <div class="grid" id="titleList"></div>

    <!-- SEKCJA ZESPÓŁ -->
    <div class="team">
        <h2>Nasz Zespół</h2>
        <div class="team-grid">

            <div class="member">
                <img src="https://i.pravatar.cc/150?img=1">
                <h3>Twoja Nazwa</h3>
                <p>Założyciel / Tłumacz</p>
            </div>

            <div class="member">
                <img src="https://i.pravatar.cc/150?img=2">
                <h3>Druga Osoba</h3>
                <p>Cleaner / Typesetter</p>
            </div>

        </div>
    </div>

</div>

<div id="seriesPage" class="hidden">
    <button onclick="goHome()">⬅ Powrót</button>
    <h2 id="seriesTitle"></h2>
    <p id="seriesDescription"></p>
    <div id="seriesTags" class="tags"></div>
    <h3>Rozdziały:</h3>
    <div id="chapterList" class="chapter-list"></div>
</div>

<div id="readerPage" class="hidden">
    <button onclick="backToSeries()">⬅ Powrót do rozdziałów</button>
    <h2 id="readerTitle"></h2>
    <div class="reader" id="readerImages"></div>
</div>

<footer>
    <a href="https://discord.gg/H4A5hTS7Gw" target="_blank">
        💜 Dołącz do naszego Discorda
    </a>
</footer>

</div>

<script>

const mangaData = [

{
    id:"Love-and-roll",
    title:"Love and Roll",
    description:"Perkusista niezależnego zespołu wpada w emocjonalną relację z fotografem.",
    cover:"https://ccdn.lezhin.com/v2/comics/7011732603881086/images/tall.webp?updated=1733476692171&width=420",
    tags:["Manhwa","Yaoi","Muzyka","Różnica wieku"],
    chapters:[
        {
            name:"Rozdział 1",
            images:[
                "images/love/ch1/1.jpg",
                "images/love/ch1/2.jpg"
            ]
        }
    ]
},

{
    id:"The-golden-goose-dressed-as-Alpha-boss",
    title:"The golden goose dressed as Alpha boss",
    description:"Były szef gangu budzi się w świecie ABO jako omega.",
    cover:"https://s1.mbcdnsaa.org/res/manga/the-golden-goose-dressed-as-alpha-boss/chapter-1/OvaGMdikoz8OA9s9cZQ75g.jpeg",
    tags:["Manhua","Yaoi","Omegaverse","Mafia"],
    chapters:[
        {
            name:"Rozdział 1",
            images:[
                "images/crimson/ch1/1.jpg"
            ]
        }
    ]
}

];

const titleList = document.getElementById("titleList");
const home = document.getElementById("home");
const seriesPage = document.getElementById("seriesPage");
const readerPage = document.getElementById("readerPage");

let currentSeries = null;

function loadTitles(filter=""){
    titleList.innerHTML="";
    mangaData
    .filter(series=>{
        const text=(series.title+" "+series.tags.join(" ")).toLowerCase();
        return text.includes(filter.toLowerCase());
    })
    .forEach(series=>{
        const card=document.createElement("div");
        card.className="card";
        card.innerHTML=`
            <img src="${series.cover}">
            <h3>${series.title}</h3>
            <div class="tags">${series.tags.join(", ")}</div>
        `;
        card.onclick=()=>openSeries(series.id);
        titleList.appendChild(card);
    });
}

function openSeries(id){
    const series=mangaData.find(s=>s.id===id);
    currentSeries=series;

    history.pushState(null,null,`?series=${id}`);

    home.classList.add("hidden");
    readerPage.classList.add("hidden");
    seriesPage.classList.remove("hidden");

    document.getElementById("seriesTitle").innerText=series.title;
    document.getElementById("seriesDescription").innerText=series.description;
    document.getElementById("seriesTags").innerText=series.tags.join(", ");

    const chapterList=document.getElementById("chapterList");
    chapterList.innerHTML="";

    series.chapters.forEach((ch,index)=>{
        const div=document.createElement("div");
        div.innerText=ch.name;
        div.onclick=()=>openReader(index);
        chapterList.appendChild(div);
    });
}

function openReader(index){
    const chapter=currentSeries.chapters[index];

    history.pushState(null,null,`?series=${currentSeries.id}&chapter=${index}`);

    seriesPage.classList.add("hidden");
    readerPage.classList.remove("hidden");

    document.getElementById("readerTitle").innerText=
        currentSeries.title+" - "+chapter.name;

    const readerImages=document.getElementById("readerImages");
    readerImages.innerHTML="";

    chapter.images.forEach(img=>{
        const image=document.createElement("img");
        image.src=img;
        readerImages.appendChild(image);
    });
}

function goHome(){
    history.pushState(null,null,`/`);
    seriesPage.classList.add("hidden");
    readerPage.classList.add("hidden");
    home.classList.remove("hidden");
}

function backToSeries(){
    openSeries(currentSeries.id);
}

function checkURL(){
    const params=new URLSearchParams(window.location.search);
    const series=params.get("series");
    const chapter=params.get("chapter");

    if(series){
        openSeries(series);
        if(chapter){
            openReader(parseInt(chapter));
        }
    }
}

loadTitles();
checkURL();

</script>

</body>
</html>
