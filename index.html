<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PSYCHIATRYK</title>

<style>
body{
    margin:0;
    font-family:Arial, Helvetica, sans-serif;
    background:linear-gradient(135deg,#0d001a,#1a0033,#120022);
    color:white;
}

header{
    background:#2a004d;
    padding:25px;
    text-align:center;
    font-size:32px;
    font-weight:bold;
    letter-spacing:3px;
    color:#d9b3ff;
    box-shadow:0 0 20px #8000ff;
}

.container{
    padding:20px;
}

.search-box{
    text-align:center;
    margin-bottom:30px;
}

.search-box input{
    width:320px;
    padding:12px;
    font-size:16px;
    border:none;
    border-radius:8px;
    background:#2a004d;
    color:white;
    outline:none;
    box-shadow:0 0 10px #8000ff;
}

.search-box input::placeholder{
    color:#c299ff;
}

.grid{
    display:flex;
    flex-wrap:wrap;
    gap:25px;
    justify-content:center;
}

.card{
    background:#1f0033;
    width:220px;
    border-radius:15px;
    overflow:hidden;
    cursor:pointer;
    transition:0.3s;
    box-shadow:0 0 15px rgba(128,0,255,0.4);
}

.card:hover{
    transform:scale(1.05);
    box-shadow:0 0 25px #b366ff;
}

.card img{
    width:100%;
    height:300px;
    object-fit:cover;
}

.card h3{
    padding:10px;
    margin:0;
    font-size:18px;
    color:#e6ccff;
}

.tags{
    padding:0 10px 15px 10px;
    font-size:12px;
    color:#b366ff;
}

.hidden{
    display:none;
}

button{
    background:#8000ff;
    color:white;
    border:none;
    padding:10px 15px;
    cursor:pointer;
    margin-top:15px;
    border-radius:6px;
}

button:hover{
    background:#a64dff;
}

.chapter-list div{
    background:#2a004d;
    padding:12px;
    margin:8px 0;
    cursor:pointer;
    border-radius:6px;
}

.chapter-list div:hover{
    background:#3d0066;
}

.reader img{
    width:90%;
    margin:20px auto;
    display:block;
    border-radius:10px;
    box-shadow:0 0 20px rgba(128,0,255,0.5);
}
</style>
</head>
<body>

<header>PSYCHIATRYK</header>

<div class="container">

<div id="home">

    <div class="search-box">
        <input type="text" id="searchInput" placeholder="Szukaj po tytule lub tagach..." onkeyup="searchManga()">
    </div>

    <div class="grid" id="titleList"></div>
</div>

<div id="seriesPage" class="hidden">
    <button onclick="goHome()">⬅ Powrót</button>
    <h2 id="seriesTitle"></h2>
    <p id="seriesDescription"></p>
    <div id="seriesTags" class="tags"></div>
    <h3>Rozdziały:</h3>
    <div id="chapterList" class="chapter-list"></div>
</div>

<div id="readerPage" class="hidden">
    <button onclick="backToSeries()">⬅ Powrót do rozdziałów</button>
    <h2 id="readerTitle"></h2>
    <div class="reader" id="readerImages"></div>
</div>

</div>

<script>

/* =========================
   🔥 TWOJE SERIE
   ========================= */

const mangaData = [

{
    id:"Love-and-roll",
    title:"Love and Roll",
    description:"Perkusista niezależnego zespołu wpada w emocjonalną relację z fotografem, którego od lat podziwia. Historia pełna napięcia, muzyki i skomplikowanych uczuć.",
    cover:"https://ccdn.lezhin.com/v2/comics/7011732603881086/images/tall.webp?updated=1733476692171&width=420",
    tags:["Manhwa","Yaoi","Muzyka","Różnica wieku"],
    chapters:[
        {
            name:"Rozdział 1",
            images:[
                "images/love/ch1/1.jpg",
                "images/love/ch1/2.jpg"
            ]
        }
    ]
},

{
    id:"The-golden-goose-dressed-as-Alpha-boss",
    title:"The golden goose dressed as Alpha boss",
    description:"Opis: W swoim poprzednim życiu Lin Qiu był budzącym postrach szefem gangu. Podczas brutalnej konfrontacji między gangami został śmiertelnie postrzelony tracąc przytomność. Kiedy wrócił... leżał w łóżku, a obok niego znajdował się mężczyzna, który właśnie się rozbierał! Lin Qiu natychmiast powstrzymał go siłą. Ale facet nie tylko nie był przestraszony, ale nawet całkiem współpracował! Lin Qiu oczywiście korzystał z seksownej bielizny. Tak... seksownej bielizny. CO?! Wtedy Lin Qiu zdał sobie sprawę, że teleportował się do świata ABO, i był teraz utrzymywaną omegą, "utrzymankiem" kogoś innego... A jego alfa? Cóż, nie było to dokładnie, czego się spodziewał.",
    cover:"https://mangadex.org/covers/30c2229e-4479-44bf-b26b-9733b12c1367/abb2602a-2604-4c20-a1a9-95020d297d42.png",
    tags:["Manhua", "Yaoi", "Omegaverse", "Zmiana ciał", "Mafia"],
    chapters:[
        {
            name:"Rozdział 1",
            images:[
                "images/crimson/ch1/1.jpg",
                "images/crimson/ch1/2.jpg"
            ]
        },
        {
            name:"Rozdział 2",
            images:[
                "images/crimson/ch2/1.jpg",
                "images/crimson/ch2/2.jpg"
            ]
        }
    ]
}

];

/* =========================
   LOGIKA
   ========================= */

const titleList = document.getElementById("titleList");
const home = document.getElementById("home");
const seriesPage = document.getElementById("seriesPage");
const readerPage = document.getElementById("readerPage");

let currentSeries = null;

function loadTitles(filter=""){
    titleList.innerHTML="";

    mangaData
    .filter(series=>{
        const text=(series.title+" "+series.tags.join(" ")).toLowerCase();
        return text.includes(filter.toLowerCase());
    })
    .forEach(series=>{
        const card=document.createElement("div");
        card.className="card";
        card.innerHTML=`
            <img src="${series.cover}">
            <h3>${series.title}</h3>
            <div class="tags">${series.tags.join(", ")}</div>
        `;
        card.onclick=()=>openSeries(series.id);
        titleList.appendChild(card);
    });
}

function searchManga(){
    const value=document.getElementById("searchInput").value;
    loadTitles(value);
}

function openSeries(id){
    const series=mangaData.find(s=>s.id===id);
    currentSeries=series;

    home.classList.add("hidden");
    seriesPage.classList.remove("hidden");

    document.getElementById("seriesTitle").innerText=series.title;
    document.getElementById("seriesDescription").innerText=series.description;
    document.getElementById("seriesTags").innerText=series.tags.join(", ");

    const chapterList=document.getElementById("chapterList");
    chapterList.innerHTML="";

    series.chapters.forEach((ch,index)=>{
        const div=document.createElement("div");
        div.innerText=ch.name;
        div.onclick=()=>openReader(index);
        chapterList.appendChild(div);
    });
}

function openReader(index){
    const chapter=currentSeries.chapters[index];

    seriesPage.classList.add("hidden");
    readerPage.classList.remove("hidden");

    document.getElementById("readerTitle").innerText=
        currentSeries.title+" - "+chapter.name;

    const readerImages=document.getElementById("readerImages");
    readerImages.innerHTML="";

    chapter.images.forEach(img=>{
        const image=document.createElement("img");
        image.src=img;
        readerImages.appendChild(image);
    });
}

function goHome(){
    seriesPage.classList.add("hidden");
    readerPage.classList.add("hidden");
    home.classList.remove("hidden");
}

function backToSeries(){
    readerPage.classList.add("hidden");
    seriesPage.classList.remove("hidden");
}

loadTitles();

</script>

</body>
</html>
