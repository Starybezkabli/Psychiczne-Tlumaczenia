<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>Psychiczne tłumaczenia — Ultimate Reader+</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

const firebaseConfig={
 apiKey:"AIzaSyCNxy9OD6k7zypqARiwcR0DvkqpL5SSU98",
 authDomain:"psychicznetlumaczenia-34d74.firebaseapp.com",
 projectId:"psychicznetlumaczenia-34d74",
 storageBucket:"psychicznetlumaczenia-34d74.appspot.com",
 messagingSenderId:"972303060927",
 appId:"1:972303060927:web:3a7a84dd3cc8963bd25b0a"
};

const app = initializeApp(firebaseConfig);
window.db = getDatabase(app);
window.dbRef = ref;
window.dbSet = set;
window.dbOn = onValue;
window.firebaseReady = true;
window.dispatchEvent(new Event("firebase-ready"));
</script>

<style>
body{margin:0;background:#0b0016;color:#e9d5ff;font-family:system-ui}
header{background:#2e1065;padding:10px;display:flex;gap:6px;flex-wrap:wrap}
.card{background:#1a0033;border:1px solid #5b21b6;padding:10px;border-radius:8px;margin:10px 0}
button{background:#6d28d9;color:white;border:none;padding:6px;border-radius:6px;cursor:pointer}
input,textarea{width:100%;margin:4px 0;background:#14002a;color:white;border:1px solid #5b21b6;padding:6px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.cover{width:100%;height:240px;object-fit:cover;border-radius:6px}
.tag{background:#3b0764;padding:4px;border-radius:6px;margin:2px;display:inline-block;cursor:pointer}
.tag.active{background:#9333ea}
.link{cursor:pointer;text-decoration:underline;color:#c4b5fd}
.readerOverlay{position:fixed;inset:0;background:black;overflow:auto;z-index:999}
.reader img{width:100%}
.mobileReader{touch-action:pan-y;overscroll-behavior:contain}
.mobileReader img{display:block}
@media(max-width:768px){
.reader{padding:0}
.reader img{border-radius:0}
}
</style>
</head>

<body>
<div id="root"></div>

<script>
function startApp(){

const e = React.createElement;
const TAGS = [
"yaoi","yuri","hetero","romans","akcja","kryminalne","horror",
"krwawe","wampiry","inny świat","fantasy","wilkołaki",
"dziewczyny","chłopcy","przyjaciele z dzieciństwa",
"rodzina królewska","psychologiczne","kosmici","szkolne",
"policja","historyczne","slice of life","omegaverse",
"wojna","walki","morderstwa","lochy","potwory","magiczne",
"auta","wyścigi","drama","różnica wieku","demony","anioły",
"zagadki","ninja","zmiana ciał","komedia","duchy","dzieci",
"dla dorosłych","medyczne","sm/bdsm/sub-dom","gry wideo",
"muzyka","konkurencje","wróżki","fetysze","zemsta","klątwy"
];

const ADMIN={mail:"valerii000vall@gmail.com", pass:"pika6969"};

function isMobile(){
 return window.innerWidth<768 || /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
}
function enableFullscreen(el){ if(!isMobile()) return; try{el?.requestFullscreen?.();}catch{} }
function enableSwipeClose(close){ let startY=0; window.addEventListener("touchstart",e=>startY=e.touches[0].clientY); window.addEventListener("touchend",e=>{ if(e.changedTouches[0].clientY-startY>120) close(); }); }
function useDB(key,initial){ const[data,setData]=React.useState(initial); React.useEffect(()=>{ if(!window.db) return; const r=dbRef(db,key); dbOn(r,s=>setData(s.exists()?s.val():initial)); },[key]); const save=v=>{ const val=typeof v==="function"?v(data):v; setData(val); dbSet(dbRef(db,key),val); }; return [data,save]; }
function multiImageUpload(cb){ const i=document.createElement("input"); i.type="file"; i.multiple=true; i.accept="image/*"; i.onchange=()=>{ Promise.all([...i.files].map(f=>new Promise(res=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.readAsDataURL(f); }))).then(cb); }; i.click(); }

// ================= APP =================
function App(){
 const [series,setSeries]=useDB("series",[]);
 const [libraries,setLibraries]=useDB("libraries",{});
 const [user,setUser]=React.useState(null);
 const [view,setView]=React.useState("home");
 const [active,setActive]=React.useState(null);
 const [reader,setReader]=React.useState(null);
 const [search,setSearch]=React.useState("");
 const [selectedTags,setSelectedTags]=React.useState([]);
 const isAdmin=user?.mail===ADMIN.mail;

 const userLib = libraries[user?.mail]||{favorites:[],deleted:[]};

 function toggleFav(id){
  if(!user) return alert("Login!");
  const updated = userLib.favorites.includes(id) ? userLib.favorites.filter(x=>x!==id) : [...userLib.favorites,id];
  setLibraries({...libraries,[user.mail]:{...userLib,favorites:updated,deleted:userLib.deleted}});
 }

 function addSeries(){
  const title = prompt("Tytuł serii:");
  if(!title) return;
  const desc = prompt("Opis serii:");
  const tagsPrompt = prompt("Wybierz tagi oddzielone przecinkami:\n"+TAGS.join(","));
  const tags = tagsPrompt ? tagsPrompt.split(",").map(t=>t.trim()).filter(t=>TAGS.includes(t)) : [];
  multiImageUpload(imgs=>{
   const cover = imgs[0] || "";
   const obj={id:Date.now()+Math.random(),title,description:desc,tags,cover,chapters:[]};
   setSeries([...series,obj]);
  });
 }

 function addChapter(s){
  const title = prompt("Tytuł rozdziału:");
  if(!title) return;
  multiImageUpload(imgs=>{
   s.chapters.push({id:Date.now()+Math.random(),title,images:imgs});
   setSeries([...series]);
  });
 }

 function filtered(){
  return series.filter(s=>{
   const t = s.title.toLowerCase().includes(search.toLowerCase());
   const g = selectedTags.length===0 || selectedTags.every(tag=>s.tags.includes(tag));
   return t && g;
  });
 }

 function deleteSeries(s){
  if(!isAdmin) return;
  const updated = series.filter(x=>x.id!==s.id);
  setSeries(updated);
  if(user) setLibraries({...libraries,[user.mail]:{...userLib,deleted:[...(userLib.deleted||[]),s],favorites:userLib.favorites}});
 }

 function deleteChapter(seriesObj,ch){
  if(!isAdmin) return;
  seriesObj.chapters = seriesObj.chapters.filter(x=>x.id!==ch.id);
  setSeries([...series]);
  if(user) setLibraries({...libraries,[user.mail]:{...userLib,deleted:[...(userLib.deleted||[]),{...ch,parent:seriesObj.title}],favorites:userLib.favorites}})
 }

 function restoreSeries(s){
  setSeries([...series,s]);
  if(user) setLibraries({...libraries,[user.mail]:{...userLib,deleted:userLib.deleted.filter(x=>x.id!==s.id),favorites:userLib.favorites}});
 }

 function restoreChapter(ch,parentTitle){
  const parent = series.find(s=>s.title===parentTitle);
  if(parent){
   parent.chapters.push(ch);
   setSeries([...series]);
  }
  if(user) setLibraries({...libraries,[user.mail]:{...userLib,deleted:userLib.deleted.filter(x=>x.id!==ch.id),favorites:userLib.favorites}});
 }

 function TagCloud(){
  const counts = {};
  series.forEach(s=>s.tags.forEach(t=>counts[t]=(counts[t]||0)+1));
  return e("div",{className:"card"},
   e("h3",null,"Chmura gatunków"),
   Object.entries(counts).sort((a,b)=>b[1]-a[1]).map(([t,c])=>
    e("span",{key:t,className:"tag "+(selectedTags.includes(t)?"active":""),onClick:()=>{
     setSelectedTags(selectedTags.includes(t)?selectedTags.filter(x=>x!==t):[...selectedTags,t])
    }},`${t} (${c})`)
   )
  );
 }

 function LibraryView(){
  if(!user) return null;
  return e("div",{className:"card"},
   e("h3",null,"Biblioteka"),
   userLib.favorites.map(f=>series.find(s=>s.id===f)).filter(Boolean).map(s=>
    e("div",{key:s.id,className:"link",onClick:()=>{setActive(s);setView("series");}},s.title)
   ),
   e("h3",null,"Usunięte"),
   (userLib.deleted||[]).map(d=>{
    return e("div",{key:d.id||d.title,className:"link"},
     e("span",null,d.title||d.name),
     d.chapters && e("button",{onClick:()=>restoreSeries(d)},"Przywróć"),
     !d.chapters && e("button",{onClick:()=>restoreChapter(d,d.parent)},"Przywróć")
    );
   })
  );
 }

 function Home(){
  return e("div",null,
   e("div",{className:"card"}, e("input",{placeholder:"Szukaj...",value:search,onChange:e=>setSearch(e.target.value)})),
   e(TagCloud),
   isAdmin&&e("button",{onClick:addSeries},"➕ Dodaj serię"),
   e(LibraryView),
   e("div",{className:"grid"}, filtered().map(s=>
    e("div",{key:s.id,className:"card"},
     e("b",{onClick:()=>{setActive(s);setView("series");}},s.title),
     e("p",null,s.description),
     e("img",{src:s.cover,className:"cover",onClick:()=>{setActive(s);setView("series");}}),
     e("button",{onClick:()=>toggleFav(s.id)},userLib.favorites.includes(s.id)?"★":"☆"),
     isAdmin&&e("button",{onClick:()=>deleteSeries(s)},"Usuń")
    )
   ))
  );
 }

 function SeriesView(){
  if(!active) return null;
  return e("div",{className:"card"},
   e("h2",null,active.title),
   e("p",null,active.description),
   active.tags.map(t=>e("span",{key:t,className:"tag"},t)),
   active.chapters.map(ch=>e("div",{key:ch.id},
    e("button",{onClick:()=>setReader(ch)},ch.title),
    isAdmin&&e("button",{onClick:()=>deleteChapter(active,ch)},"Usuń")
   )),
   isAdmin&&e("button",{onClick:()=>addChapter(active)},"➕ Rozdział")
  );
 }

 function Login(){
  return e("div",{className:"card"},
   e("button",{onClick:()=>{
    const mail=prompt("Email:");
    const pass=prompt("Hasło:");
    if(mail===ADMIN.mail&&pass===ADMIN.pass) setUser({mail});
    else setUser({mail});
   }},"Login"));
 }

 function Reader(){
  React.useEffect(()=>{ const el=document.querySelector(".readerOverlay"); enableFullscreen(el); enableSwipeClose(()=>setReader(null)); },[]);
  return e("div",{className:"readerOverlay "+(isMobile()?"mobileReader":"")},
   e("button",{onClick:()=>setReader(null)},"Zamknij"),
   e("div",{className:"reader"},reader?.images?.map((img,i)=>e("img",{key:i,src:img})))
  );
 }

 return e("div",null,
  e("header",null,
   e("button",{onClick:()=>setView("home")},"Home"),
   e("button",{onClick:()=>setView("login")},"Login")
  ),
  view==="home"&&e(Home),
  view==="series"&&e(SeriesView),
  view==="login"&&e(Login),
  reader&&e(Reader)
 );
}

// Start app
window.addEventListener("firebase-ready",()=>ReactDOM.createRoot(document.getElementById("root")).render(e(App)));

</script>
</body>
</html>
