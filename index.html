<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>Psychiczne tłumaczenia — Ultimate Reader+</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";
import { getAuth, onAuthStateChanged, createUserWithEmailAndPassword, signInWithEmailAndPassword } 
from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

const firebaseConfig={
 apiKey:"API_KEY",
 authDomain:"psychicznetlumaczenia-34d74.firebaseapp.com",
 databaseURL:"https://psychicznetlumaczenia-34d74-default-rtdb.firebaseio.com/",
 projectId:"psychicznetlumaczenia-34d74",
 storageBucket:"psychicznetlumaczenia-34d74.appspot.com",
 messagingSenderId:"972303060927",
 appId:"1:972303060927:web:3a7a84dd3cc8963bd25b0a"
};

const app=initializeApp(firebaseConfig);
window.db=getDatabase(app);
window.dbRef=ref;
window.dbSet=set;
window.dbOn=onValue;
window.auth=getAuth(app);
window.firebaseReady=true;
</script>

<style>
body{margin:0;background:#0b0016;color:#e9d5ff;font-family:system-ui}
header{background:#2e1065;padding:10px;display:flex;gap:6px;flex-wrap:wrap}
.card{background:#1a0033;border:1px solid #5b21b6;padding:10px;border-radius:8px;margin:10px 0}
button{background:#6d28d9;color:white;border:none;padding:6px;border-radius:6px;cursor:pointer}
input{width:100%;margin:4px 0;background:#14002a;color:white;border:1px solid #5b21b6;padding:6px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.tag{background:#3b0764;padding:4px 8px;border-radius:6px;margin:4px;display:inline-block;cursor:pointer}
.tag.active{background:#9333ea}
.readerOverlay{position:fixed;inset:0;background:black;overflow:auto;z-index:999}
.reader img{width:100%;display:block;margin-bottom:10px}
</style>
</head>

<body>
<div id="root"></div>

<script>
function waitFirebase(cb){
 if(window.firebaseReady)cb();
 else setTimeout(()=>waitFirebase(cb),50);
}
waitFirebase(startApp);

function startApp(){
const e=React.createElement;

/* ===== TAG LIST ===== */
const TAGS=["yaoi","yuri","hetero","romans","akcja","kryminalne","horror", "krwawe","wampiry","inny świat","fantasy","wilkołaki", "dziewczyny","chłopcy","przyjaciele z dzieciństwa", "rodzina królewska","psychologiczne","kosmici","szkolne", "policja","historyczne","slice of life","omegaverse", "wojna","walki","morderstwa","lochy","potwory","magiczne", "auta","wyścigi","drama","różnica wieku","demony","anioły", "zagadki","ninja","zmiana ciał","komedia","duchy","dzieci", "dla dorosłych","medyczne","sm/bdsm/sub-dom","gry wideo", "muzyka","konkurencje","wróżki","fetysze","zemsta","klątwy"];

/* ===== SAFE FIREBASE HOOK ===== */
function useDB(key,initial){
 const[data,setData]=React.useState(initial);
 const loaded=React.useRef(false);
 React.useEffect(()=>{
  const r=dbRef(db,key);
  dbOn(r,s=>{
   if(s.exists()) setData(s.val());
   else if(!loaded.current){ dbSet(r,initial); }
   loaded.current=true;
  });
 },[key]);
 const save=v=>{
  const val=typeof v==="function"?v(data):v;
  setData(val);
  dbSet(dbRef(db,key),val);
 };
 return[data,save];
}

/* ===== AUTH ===== */
function useAuth(){
 const[user,setUser]=React.useState(null);
 React.useEffect(()=>onAuthStateChanged(auth,u=>setUser(u)),[]);
 return user;
}

/* ===== APP ===== */
function App(){
const [series,setSeries]=useDB("series",[]);
const user=useAuth();
const [view,setView]=React.useState("home");
const [active,setActive]=React.useState(null);
const [reader,setReader]=React.useState(null);
const [search,setSearch]=React.useState("");
const [tagFilter,setTagFilter]=React.useState([]);

/* ===== FILTER ===== */
function filtered(){
 return (series||[]).filter(s=>{
  const titleMatch=s.title?.toLowerCase().includes(search.toLowerCase());
  const tagMatch=tagFilter.length===0 || tagFilter.every(t=>s.tags.includes(t));
  return titleMatch && tagMatch;
 });
}

/* ===== ADD SERIES ===== */
function addSeries(){
 const title=prompt("Tytuł:");
 if(!title)return;
 const tags=prompt("Tagi oddzielone przecinkami:");
 const obj={id:Date.now(),title,tags:tags?tags.split(",").map(t=>t.trim()):[],chapters:[]};
 setSeries(s=>[...s,obj]);
}

/* ===== ADD CHAPTER WITH MULTI IMAGES ===== */
function addChapter(s){
 const title=prompt("Tytuł rozdziału:");
 if(!title)return;

 const input=document.createElement("input");
 input.type="file";
 input.multiple=true;
 input.accept="image/*";

 input.onchange=()=>{
  Promise.all([...input.files].map(f=>new Promise(res=>{
   const r=new FileReader();
   r.onload=()=>res(r.result);
   r.readAsDataURL(f);
  }))).then(images=>{
   const chapter={id:Date.now(),title,images};
   s.chapters.push(chapter);
   setSeries([...series]);
  });
 };
 input.click();
}

/* ===== HOME ===== */
function Home(){
 return e("div",null,
  e("div",{className:"card"},
   e("input",{placeholder:"Szukaj...",value:search,onChange:e=>setSearch(e.target.value)}),
   e("div",null,
    TAGS.map(t=>
     e("span",{key:t,className:"tag "+(tagFilter.includes(t)?"active":""),onClick:()=>{
      setTagFilter(tagFilter.includes(t)?tagFilter.filter(x=>x!==t):[...tagFilter,t]);
     }},t)
    )
   )
  ),
  user&&e("button",{onClick:addSeries},"Dodaj serię"),
  e("div",{className:"grid"},
   filtered().map(s=>
    e("div",{key:s.id,className:"card"},
     e("b",{onClick:()=>{setActive(s);setView("series");}},s.title),
     e("div",null,(s.tags||[]).join(", "))
    )
   )
  )
 );
}

/* ===== SERIES VIEW ===== */
function Series(){
 if(!active)return null;
 return e("div",{className:"card"},
  e("h2",null,active.title),
  active.chapters.map(ch=>
   e("div",{key:ch.id},
    e("button",{onClick:()=>setReader(ch)},ch.title)
   )
  ),
  user&&e("button",{onClick:()=>addChapter(active)},"Dodaj rozdział")
 );
}

/* ===== READER ===== */
function Reader(){
 return e("div",{className:"readerOverlay"},
  e("button",{onClick:()=>setReader(null)},"Zamknij"),
  e("div",{className:"reader"},
   reader.images.map((img,i)=>e("img",{key:i,src:img}))
  )
 );
}

/* ===== LOGIN ===== */
function Login(){
 return e("div",{className:"card"},
  e("input",{id:"mail",placeholder:"Email"}),
  e("input",{id:"pass",type:"password",placeholder:"Hasło"}),
  e("button",{onClick:()=>{
   const mail=document.getElementById("mail").value;
   const pass=document.getElementById("pass").value;
   createUserWithEmailAndPassword(auth,mail,pass)
   .catch(()=>signInWithEmailAndPassword(auth,mail,pass));
  }},"Zaloguj / Zarejestruj")
 );
}

return e("div",null,
 e("header",null,
  e("button",{onClick:()=>setView("home")},"Home"),
  e("button",{onClick:()=>setView("login")},"Login")
 ),
 view==="home"&&e(Home),
 view==="series"&&e(Series),
 view==="login"&&e(Login),
 reader&&e(Reader)
);
}

ReactDOM.createRoot(document.getElementById("root")).render(e(App));
}
</script>
</body>
</html>
