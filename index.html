<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>Psychiczne tłumaczenia — Ultimate Reader+</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getDatabase, ref, set, onValue, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";
import { getStorage, ref as sRef, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-storage.js";

const firebaseConfig={
 apiKey:"AIzaSyCNxy9OD6k7zypqARiwcR0DvkqpL5SSU98",
 authDomain:"psychicznetlumaczenia-34d74.firebaseapp.com",
 projectId:"psychicznetlumaczenia-34d74",
 storageBucket:"psychicznetlumaczenia-34d74.appspot.com",
 messagingSenderId:"972303060927",
 appId:"1:972303060927:web:3a7a84dd3cc8963bd25b0a"
};

const app=initializeApp(firebaseConfig);
window.db=getDatabase(app);
window.dbRef=ref;
window.dbSet=set;
window.dbOn=onValue;
window.dbUpdate=update;
window.storage=getStorage(app);
window.firebaseReady=true;
</script>

<style>
body{margin:0;background:#0b0016;color:#e9d5ff;font-family:system-ui}
header{background:#2e1065;padding:10px;display:flex;gap:6px;flex-wrap:wrap}
.card{background:#1a0033;border:1px solid #5b21b6;padding:10px;border-radius:8px;margin:10px 0}
button{background:#6d28d9;color:white;border:none;padding:6px;border-radius:6px;cursor:pointer}
input,textarea{width:100%;margin:4px 0;background:#14002a;color:white;border:1px solid #5b21b6;padding:6px;border-radius:6px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.cover{width:100%;height:240px;object-fit:cover;border-radius:6px}
.tag{background:#3b0764;padding:4px;border-radius:6px;margin:2px;display:inline-block;cursor:pointer}
.tag.active{background:#9333ea}
.link{cursor:pointer;text-decoration:underline;color:#c4b5fd}

.readerOverlay{position:fixed;inset:0;background:black;overflow:auto;z-index:999}
.reader img{width:100%}
.mobileReader{touch-action:pan-y;overscroll-behavior:contain}
.mobileReader img{display:block}

@media(max-width:768px){
.reader{padding:0}
.reader img{border-radius:0}
}
.avatar{width:40px;height:40px;border-radius:50%;object-fit:cover;margin-right:6px}
.userCard{display:flex;align-items:center;gap:6px;margin-bottom:4px}
</style>
</head>

<body>
<div id="root"></div>

<script>
function waitFirebase(cb){
 if(window.firebaseReady&&window.db)cb();
 else setTimeout(()=>waitFirebase(cb),50);
}
waitFirebase(startApp);

function startApp(){
const e=React.createElement;
const TAGS=[
"yaoi","yuri","hetero","romans","akcja","kryminalne","horror",
"krwawe","wampiry","inny świat","fantasy","wilkołaki",
"dziewczyny","chłopcy","przyjaciele z dzieciństwa",
"rodzina królewska","psychologiczne","kosmici","szkolne",
"policja","historyczne","slice of life","omegaverse",
"wojna","walki","morderstwa","lochy","potwory","magiczne",
"auta","wyścigi","drama","różnica wieku","demony","anioły",
"zagadki","ninja","zmiana ciał","komedia","duchy","dzieci",
"dla dorosłych","medyczne","sm/bdsm/sub-dom","gry wideo",
"muzyka","konkurencje","wróżki","fetysze","zemsta","klątwy"
];

const ADMIN={
 mail:"valerii000vall@gmail.com",
 pass:"pika6969"
};

/* ===== MOBILE ===== */
function isMobile(){
 return window.innerWidth<768 || /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
}
function enableFullscreen(el){ if(!isMobile())return; try{el?.requestFullscreen?.();}catch{}}
function enableSwipeClose(close){
 let startY=0;
 window.addEventListener("touchstart",e=>{startY=e.touches[0].clientY});
 window.addEventListener("touchend",e=>{
  if(e.changedTouches[0].clientY-startY>120)close();
 });
}

/* ===== FIREBASE HOOK ===== */
function useDB(key,initial){
 const[data,setData]=React.useState(initial);
 React.useEffect(()=>{
  if(!window.db)return;
  const r=dbRef(db,key);
  dbOn(r,s=>setData(s.exists()?s.val():initial));
 },[key]);
 const save=v=>{
  const val=typeof v==="function"?v(data):v;
  setData(val);
  dbSet(dbRef(db,key),val);
 };
 return[data,save];
}

/* ===== LOCAL STORAGE LOGIN ===== */
function saveUser(user){localStorage.setItem("USER",JSON.stringify(user))}
function loadUser(){try{return JSON.parse(localStorage.getItem("USER"))}catch{return null}}

/* ===== IMAGE UPLOAD ===== */
function multiImageUpload(cb){
 const i=document.createElement("input");
 i.type="file"; i.multiple=true; i.accept="image/*";
 i.onchange=()=>{
  Promise.all([...i.files].map(f=>new Promise(res=>{
   const r=new FileReader();
   r.onload=()=>res(r.result);
   r.readAsDataURL(f);
  }))).then(cb);
 };
 i.click();
}

/* ===== TAG PICKER ===== */
function chooseTagsMulti(existing=[]){
 const res=prompt("Tagi (oddziel przecinkami):\n"+TAGS.join(", "));
 if(!res)return existing;
 return res.split(",").map(t=>t.trim()).filter(t=>TAGS.includes(t));
}

/* ===== APP ===== */
function App(){
const[series,setSeries]=useDB("series",[]);
const[libraries,setLibraries]=useDB("libraries",{});
const[users,setUsers]=useDB("users",{}); // dla awatarów i kont
const[user,setUser]=React.useState(loadUser());
const[view,setView]=React.useState("home");
const[active,setActive]=React.useState(null);
const[reader,setReader]=React.useState(null);
const[search,setSearch]=React.useState("");
const[tag,setTag]=React.useState(null);

React.useEffect(()=>{ if(user)saveUser(user); },[user]);

const isAdmin=user?.mail===ADMIN.mail;
const favorites=user?libraries[user.mail]||[]:[];

/* ===== FAVORITES ===== */
function toggleFav(id){
 if(!user)return alert("Zaloguj się");
 const updated=favorites.includes(id)
  ?favorites.filter(f=>f!==id)
  :[...favorites,id];
 setLibraries({...libraries,[user.mail]:updated});
}

/* ===== FILTER ===== */
function filtered(){
 return(series||[]).filter(s=>{
  const t=s.title?.toLowerCase().includes(search.toLowerCase());
  const g=!tag||(s.tags||[]).some(tt=>tag.includes(tt) || tag===tt);
  return t&&g;
 });
}

/* ===== ADMIN ===== */
function addSeries(){
 const title=prompt("Tytuł serii:");
 if(!title)return;
 const tags=chooseTagsMulti();
 const desc=prompt("Opis serii:")||"";
 multiImageUpload(imgs=>{
  const obj={id:Date.now()+Math.random(),title,tags,desc,cover:imgs[0]||"",chapters:imgs.slice(1)||[]};
  setSeries([...series,obj]);
 });
}

/* ===== TAG CLOUD ===== */
function TagCloud(){
 const counts={};
 (series||[]).forEach(s=>{(s.tags||[]).forEach(t=>counts[t]=(counts[t]||0)+1)});
 return e("div",{className:"card"},
  e("h3",null,"Chmura gatunków"),
  Object.entries(counts).sort((a,b)=>b[1]-a[1]).map(([t,c])=>
   e("span",{key:t,className:"tag "+(tag===t?"active":""),onClick:()=>setTag(tag===t?null:t)},`${t} (${c})`)
  )
 );
}

/* ===== VIEWS ===== */
function Library(){
 if(!user)return null;
 const fav=(series||[]).filter(s=>favorites.includes(s.id));
 return e("div",{className:"card"},
  e("h3",null,"Biblioteka"),
  fav.map(s=>e("div",{key:s.id,className:"link",onClick:()=>{setActive(s);setView("series")}},s.title))
 );
}

function Home(){
 return e("div",null,
 e("div",{className:"card"},
  e("input",{placeholder:"Szukaj...",value:search,onChange:e=>setSearch(e.target.value)}),
 ),
 e(TagCloud),
 isAdmin&&e("button",{onClick:addSeries},"➕ Dodaj serię"),
 e(Library),
 e("div",{className:"grid"},
  filtered().map(s=>e("div",{key:s.id,className:"card"},
   s.cover&&e("img",{src:s.cover,className:"cover",onClick:()=>{setActive(s);setView("series")}}),
   e("b",{onClick:()=>{setActive(s);setView("series")}},s.title),
   e("div",null,s.desc),
   e("button",{onClick:()=>toggleFav(s.id)},favorites.includes(s.id)?"★":"☆")
  ))
 )
 );
}

function SeriesView(){
 if(!active)return null;
 return e("div",{className:"card"},
  e("h2",null,active.title),
  e("div",null,active.tags?.map(t=>e("span",{key:t,className:"tag"},t))),
  e("div",null,active.chapters?.map(ch=>e("div",{key:ch.id},
    e("button",{onClick:()=>setReader(ch)},ch.title)
  ))),
  isAdmin&&e("button",{onClick:()=>{
   const title=prompt("Rozdział:");
   multiImageUpload(imgs=>{
    active.chapters.push({id:Date.now()+Math.random(),title,images:imgs});
    setSeries([...series]);
   });
  }},"➕ Rozdział")
 );
}

function Login(){
 return e("div",{className:"card"},
  e("button",{onClick:async()=>{
   const mail=prompt("Email:");
   const pass=prompt("Hasło:");
   if(users[mail]){setUser({mail,...users[mail]});return;}
   const name=prompt("Nazwa użytkownika:");
   const avatarUrl="";
   const newUser={mail,name,avatar:avatarUrl};
   setUsers({...users,[mail]:newUser});
   setUser(newUser);
  }},"Login / Rejestracja")
 );
}

function Reader(){
 React.useEffect(()=>{enableFullscreen(document.querySelector(".readerOverlay")); enableSwipeClose(()=>setReader(null));},[]);
 if(!reader)return null;
 return e("div",{className:"readerOverlay "+(isMobile()?"mobileReader":"")},
  e("button",{onClick:()=>setReader(null)},"Zamknij"),
  e("div",{className:"reader"},
   reader.images?.map((img,i)=>e("img",{key:i,src:img}))
  )
 );
}

/* ===== MAIN ===== */
return e("div",null,
 e("header",null,
  e("button",{onClick:()=>setView("home")},"Home"),
  e("button",{onClick:()=>setView("login")},"Login")
 ),
 view==="home"&&e(Home),
 view==="series"&&e(SeriesView),
 view==="login"&&e(Login),
 reader&&e(Reader)
);
}

ReactDOM.createRoot(document.getElementById("root")).render(e(App));
}
</script>
</body>
</html>
