<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manga / Manhwa Tłumaczenia</title>

<style>
body{
    margin:0;
    font-family:Arial, Helvetica, sans-serif;
    background:#0f0f0f;
    color:white;
}

header{
    background:#1a1a1a;
    padding:15px;
    text-align:center;
    font-size:24px;
    font-weight:bold;
}

.container{
    padding:20px;
}

.grid{
    display:flex;
    flex-wrap:wrap;
    gap:20px;
    justify-content:center;
}

.card{
    background:#1e1e1e;
    width:220px;
    border-radius:10px;
    overflow:hidden;
    cursor:pointer;
    transition:0.3s;
}

.card:hover{
    transform:scale(1.05);
}

.card img{
    width:100%;
    height:300px;
    object-fit:cover;
}

.card h3{
    padding:10px;
    margin:0;
}

.tags{
    padding:0 10px 10px 10px;
    font-size:12px;
    color:#00ffcc;
}

.hidden{
    display:none;
}

button{
    background:#00ffcc;
    border:none;
    padding:10px 15px;
    cursor:pointer;
    margin-top:10px;
}

.chapter-list div{
    background:#1e1e1e;
    padding:10px;
    margin:5px 0;
    cursor:pointer;
}

.reader img{
    width:90%;
    margin:15px auto;
    display:block;
}
</style>
</head>
<body>

<header>Manga / Manhwa Tłumaczenia</header>

<div class="container">

<!-- STRONA GŁÓWNA -->
<div id="home">
    <div class="grid" id="titleList"></div>
</div>

<!-- STRONA SERII -->
<div id="seriesPage" class="hidden">
    <button onclick="goHome()">⬅ Powrót</button>
    <h2 id="seriesTitle"></h2>
    <p id="seriesDescription"></p>
    <div id="seriesTags" class="tags"></div>
    <h3>Rozdziały:</h3>
    <div id="chapterList" class="chapter-list"></div>
</div>

<!-- CZYTNIK -->
<div id="readerPage" class="hidden">
    <button onclick="backToSeries()">⬅ Powrót do rozdziałów</button>
    <h2 id="readerTitle"></h2>
    <div class="reader" id="readerImages"></div>
</div>

</div>

<script>

/* =========================
   🔥 TUTAJ DODAJESZ SERIE
   ========================= */

const mangaData = [
{
    id:"Love and roll",
    title:"Love and roll",
    description:"Tłumacz: Eri
Cleaner: Stary bez kabli

Opis: Oh Dokhee, perkusista Bold Rabbit, niezależnego zespołu będącego na krawędzi wybicia się, otrzymuje propozycję udziału w głośnej sesji zdjęciowej. Początkowo niezdecydowany i nieśmiały przed aparatem, zgadza się, gdy dowiaduje się, że zdjęcia będzie robić Myung Leejin, osoba, którą Dokhee podziwia od lat. To, co zaczyna się jako zwykła sesja zdjęciowa, szybko przeradza się w zamieszanie, gdy Leejin źle rozumie Dokhee. Próbując wyjaśnić sprawę, Dokhee uwodzi go i doprowadza do stosunku. Gdy granice między pożądaniem a nieporozumieniem zacierają się, Dokhee zostaje pochłonięty przez emocje, które ledwo jest w stanie kontrolować. Czy skrywana miłość Dokhee w końcu dosięgnie Leejina, czy też wszystko się rozpadnie, zanim jeszcze się zacznie?",
    cover:"b41021be842c310c1015df5c0c2d1622f97bab8a_600_800_31166",
    tags:["Manhwa, Yaoi, Muzyka, Różnica wieku"],
    chapters:[
        {
            name:"Rozdział 1",
            images:[
                "images/solo/ch1/1.jpg",
                "images/solo/ch1/2.jpg",
                "images/solo/ch1/3.jpg"
            ]
        },
        {
            name:"Rozdział 2",
            images:[
                "images/solo/ch2/1.jpg",
                "images/solo/ch2/2.jpg"
            ]
        }
    ]
}

];


/* =========================
   LOGIKA STRONY
   ========================= */

const titleList = document.getElementById("titleList");
const home = document.getElementById("home");
const seriesPage = document.getElementById("seriesPage");
const readerPage = document.getElementById("readerPage");

let currentSeries = null;

function loadTitles(){
    titleList.innerHTML="";
    mangaData.forEach(series=>{
        const card=document.createElement("div");
        card.className="card";
        card.innerHTML=`
            <img src="${series.cover}">
            <h3>${series.title}</h3>
            <div class="tags">${series.tags.join(", ")}</div>
        `;
        card.onclick=()=>openSeries(series.id);
        titleList.appendChild(card);
    });
}

function openSeries(id){
    const series=mangaData.find(s=>s.id===id);
    currentSeries=series;

    home.classList.add("hidden");
    seriesPage.classList.remove("hidden");

    document.getElementById("seriesTitle").innerText=series.title;
    document.getElementById("seriesDescription").innerText=series.description;
    document.getElementById("seriesTags").innerText=series.tags.join(", ");

    const chapterList=document.getElementById("chapterList");
    chapterList.innerHTML="";

    series.chapters.forEach((ch,index)=>{
        const div=document.createElement("div");
        div.innerText=ch.name;
        div.onclick=()=>openReader(index);
        chapterList.appendChild(div);
    });
}

function openReader(index){
    const chapter=currentSeries.chapters[index];

    seriesPage.classList.add("hidden");
    readerPage.classList.remove("hidden");

    document.getElementById("readerTitle").innerText=
        currentSeries.title+" - "+chapter.name;

    const readerImages=document.getElementById("readerImages");
    readerImages.innerHTML="";

    chapter.images.forEach(img=>{
        const image=document.createElement("img");
        image.src=img;
        readerImages.appendChild(image);
    });
}

function goHome(){
    seriesPage.classList.add("hidden");
    home.classList.remove("hidden");
}

function backToSeries(){
    readerPage.classList.add("hidden");
    seriesPage.classList.remove("hidden");
}

loadTitles();

</script>

</body>
</html>
