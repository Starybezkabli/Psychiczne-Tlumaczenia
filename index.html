<style>
body{
    margin:0;
    font-family:Arial, Helvetica, sans-serif;
    background:linear-gradient(135deg,#0d001a,#1a0033,#120022);
    color:white;
}

header{
    background:#2a004d;
    padding:25px;
    text-align:center;
    font-size:32px;
    font-weight:bold;
    letter-spacing:3px;
    color:#d9b3ff;
    box-shadow:0 0 20px #8000ff;
}

.container{
    padding:20px;
}

.search-box{
    text-align:center;
    margin-bottom:30px;
}

.search-box input{
    width:320px;
    padding:12px;
    font-size:16px;
    border:none;
    border-radius:8px;
    background:#2a004d;
    color:white;
    outline:none;
    box-shadow:0 0 10px #8000ff;
}

.grid{
    display:flex;
    flex-wrap:wrap;
    gap:25px;
    justify-content:center;
}

.card{
    background:#1f0033;
    width:220px;
    border-radius:15px;
    overflow:hidden;
    cursor:pointer;
    transition:0.3s;
    box-shadow:0 0 15px rgba(128,0,255,0.4);
}

.card:hover{
    transform:scale(1.05);
    box-shadow:0 0 25px #b366ff;
}

.card img{
    width:100%;
    height:300px;
    object-fit:cover;
}

.card h3{
    padding:10px;
    margin:0;
    font-size:18px;
    color:#e6ccff;
}

.tags{
    padding:0 10px 15px 10px;
    font-size:12px;
    color:#b366ff;
}

.hidden{ display:none; }

button{
    background:#8000ff;
    color:white;
    border:none;
    padding:10px 15px;
    cursor:pointer;
    margin-top:15px;
    border-radius:6px;
}

button:hover{ background:#a64dff; }

.chapter-list div{
    background:#2a004d;
    padding:12px;
    margin:8px 0;
    cursor:pointer;
    border-radius:6px;
}

.chapter-list div:hover{
    background:#3d0066;
}

html, body{
    margin:0;
    padding:0;
    background:black; /* opcjonalnie dla readera */
}

/* kontener czytnika */
.reader{
    width:100%;
    margin:0;
    padding:0;
    line-height:0;   /* usuwa mikro-przerwy */
}

/* obrazy */
.reader img{
    width:100%;      /* zamiast 100vw */
    height:auto;
    display:block;
    margin:0;
    padding:0;
    border:0;
}

/* ZESPÓŁ */

.team{
    margin-top:60px;
    text-align:center;
}

.team-grid{
    display:flex;
    justify-content:center;
    gap:30px;
    flex-wrap:wrap;
    margin-top:20px;
}

.member{
    background:#1f0033;
    padding:20px;
    border-radius:15px;
    width:220px;
    box-shadow:0 0 15px rgba(128,0,255,0.4);
}

.member img{
    width:100px;
    height:100px;
    border-radius:50%;
    object-fit:cover;
    margin-bottom:10px;
}

footer{
    margin-top:60px;
    text-align:center;
    padding:20px;
}

footer a{
    color:#d9b3ff;
    font-size:18px;
    text-decoration:none;
}

footer a:hover{
    text-decoration:underline;
}

    /* TELEFONY */
@media (max-width: 600px){

    .grid{
        gap:15px;
    }

    .card{
        width:45%;   /* dwie karty obok siebie */
    }

    .card img{
        height:200px;  /* mniejsza okładka */
    }

    .card h3{
        font-size:14px;  /* mniejszy tytuł */
    }

    .tags{
        font-size:10px;
    }

    .search-box input{
        width:90%;
    }
}

</style>
</head>

    .filter(series=>{
        const text=(series.title+" "+series.tags.join(" ")).toLowerCase();
        return text.includes(filter.toLowerCase());
    })
    .forEach(series=>{
        const card=document.createElement("div");
        card.className="card";
        card.innerHTML=`
            <img src="${series.cover}">
            <h3>${series.title}</h3>
            <div class="tags">${series.tags.join(", ")}</div>
        `;
        card.onclick=()=>openSeries(series.id);
        titleList.appendChild(card);
    });
}

function openSeries(id){
    const series=mangaData.find(s=>s.id===id);
    currentSeries=series;

    history.pushState(null,null,`?series=${id}`);

    home.classList.add("hidden");
    readerPage.classList.add("hidden");
    seriesPage.classList.remove("hidden");

    document.getElementById("seriesTitle").innerText=series.title;
    document.getElementById("seriesDescription").innerText=series.description;
    document.getElementById("seriesTags").innerText=series.tags.join(", ");

    const chapterList=document.getElementById("chapterList");
    chapterList.innerHTML="";

    series.chapters.forEach((ch,index)=>{
        const div=document.createElement("div");
        div.innerText=ch.name;
        div.onclick=()=>openReader(index);
        chapterList.appendChild(div);
    });
}

function openReader(index){
    const chapter=currentSeries.chapters[index];

    history.pushState(null,null,`?series=${currentSeries.id}&chapter=${index}`);

    seriesPage.classList.add("hidden");
    readerPage.classList.remove("hidden");

    document.getElementById("readerTitle").innerText=
        currentSeries.title+" - "+chapter.name;

    const readerImages=document.getElementById("readerImages");
    readerImages.innerHTML="";

    chapter.images.forEach(img=>{
        const image=document.createElement("img");
        image.src=img;
        readerImages.appendChild(image);
    });
}

function goHome(){
    history.pushState(null,null,`/`);
    seriesPage.classList.add("hidden");
    readerPage.classList.add("hidden");
    home.classList.remove("hidden");
}

function backToSeries(){
    openSeries(currentSeries.id);
}

function checkURL(){
    const params=new URLSearchParams(window.location.search);
    const series=params.get("series");
    const chapter=params.get("chapter");

    if(series){
        openSeries(series);
        if(chapter){
            openReader(parseInt(chapter));
        }
    }
}

loadTitles();
checkURL();

    function searchManga(){
    const value = document
        .getElementById("searchInput")
        .value
        .trim()
        .toLowerCase();

    loadTitles(value);
}


</script>
