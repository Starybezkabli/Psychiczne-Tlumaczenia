<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>Psychiczne tłumaczenia — Ultimate Reader+</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

const firebaseConfig={
 apiKey:"AIzaSyCNxy9OD6k7zypqARiwcR0DvkqpL5SSU98",
 authDomain:"psychicznetlumaczenia-34d74.firebaseapp.com",
 projectId:"psychicznetlumaczenia-34d74",
 storageBucket:"psychicznetlumaczenia-34d74.appspot.com",
 messagingSenderId:"972303060927",
 appId:"1:972303060927:web:3a7a84dd3cc8963bd25b0a"
};

const app = initializeApp(firebaseConfig);
window.db = getDatabase(app);
window.dbRef = ref;
window.dbSet = set;
window.dbOn = onValue;
window.firebaseReady = true;
</script>

<style>
body{margin:0;background:#0b0016;color:#e9d5ff;font-family:system-ui}
header{background:#2e1065;padding:10px;display:flex;gap:6px;flex-wrap:wrap}
.card{background:#1a0033;border:1px solid #5b21b6;padding:10px;border-radius:8px;margin:10px 0}
button{background:#6d28d9;color:white;border:none;padding:6px;border-radius:6px;cursor:pointer}
input,textarea{width:100%;margin:4px 0;background:#14002a;color:white;border:1px solid #5b21b6;padding:6px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.cover{width:100%;height:240px;object-fit:cover;border-radius:6px}
.tag{background:#3b0764;padding:4px;border-radius:6px;margin:2px;display:inline-block;cursor:pointer}
.tag.active{background:#9333ea}
.link{cursor:pointer;text-decoration:underline;color:#c4b5fd}

.readerOverlay{position:fixed;inset:0;background:black;overflow:auto;z-index:999}
.reader img{width:100%}

.mobileReader{touch-action:pan-y;overscroll-behavior:contain}
.mobileReader img{display:block}

@media(max-width:768px){
.reader{padding:0}
.reader img{border-radius:0}
}
</style>
</head>

<body>
<div id="root"></div>

<script>
function waitFirebase(cb){
 if(window.firebaseReady && window.db) cb();
 else setTimeout(()=>waitFirebase(cb),50);
}
waitFirebase(startApp);

function startApp(){
const e = React.createElement;
const TAGS = [
"yaoi","yuri","hetero","romans","akcja","kryminalne","horror",
"krwawe","wampiry","inny świat","fantasy","wilkołaki",
"dziewczyny","chłopcy","przyjaciele z dzieciństwa",
"rodzina królewska","psychologiczne","kosmici","szkolne",
"policja","historyczne","slice of life","omegaverse",
"wojna","walki","morderstwa","lochy","potwory","magiczne",
"auta","wyścigi","drama","różnica wieku","demony","anioły",
"zagadki","ninja","zmiana ciał","komedia","duchy","dzieci",
"dla dorosłych","medyczne","sm/bdsm/sub-dom","gry wideo",
"muzyka","konkurencje","wróżki","fetysze","zemsta","klątwy"
];
const ADMIN={mail:"valerii000vall@gmail.com", pass:"pika6969"};

function isMobile(){ return window.innerWidth<768 || /Android|iPhone|iPad|iPod/i.test(navigator.userAgent); }
function enableFullscreen(el){ if(!isMobile())return; try{el?.requestFullscreen?.();}catch{} }
function enableSwipeClose(close){ let startY=0; window.addEventListener("touchstart",e=>startY=e.touches[0].clientY); window.addEventListener("touchend",e=>{ if(e.changedTouches[0].clientY-startY>120)close(); }); }

function useDB(key,initial){
 const [data,setData] = React.useState(initial);
 React.useEffect(()=>{
  if(!window.db)return;
  dbOn(dbRef(db,key), s=>setData(s.exists()?s.val():initial));
 },[key]);
 const save=v=>{ const val=typeof v==="function"?v(data):v; setData(val); dbSet(dbRef(db,key),val); };
 return [data,save];
}

function multiImageUpload(cb){
 const i=document.createElement("input");
 i.type="file"; i.multiple=true; i.accept="image/*";
 i.onchange=()=>{ Promise.all([...i.files].map(f=>new Promise(res=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.readAsDataURL(f); }))).then(cb); };
 i.click();
}

function App(){
const [series,setSeries]=useDB("series",[]);
const [libraries,setLibraries]=useDB("libraries",{});
const [user,setUser] = React.useState(JSON.parse(localStorage.getItem("user"))||null);
const [view,setView] = React.useState("home");
const [active,setActive] = React.useState(null);
const [reader,setReader] = React.useState(null);
const [search,setSearch] = React.useState("");
const [searchTags,setSearchTags] = React.useState([]);

const isAdmin = user?.mail===ADMIN.mail;
const favorites = user ? libraries[user.mail]||[] : [];

React.useEffect(()=>{ localStorage.setItem("user", JSON.stringify(user)); },[user]);

function toggleFav(id){
 if(!user)return alert("Zaloguj się!");
 const updated=favorites.includes(id) ? favorites.filter(f=>f!==id) : [...favorites,id];
 setLibraries({...libraries,[user.mail]:updated});
}

function filtered(){
 return (series||[]).filter(s=>{
  const titleOk=s.title.toLowerCase().includes(search.toLowerCase());
  const tagsOk=searchTags.length===0 || searchTags.every(t=>s.tags.includes(t));
  return titleOk && tagsOk;
 });
}

/* ===== ADD SERIES ===== */
function AddSeriesForm({onAdd}){
 const [title,setTitle]=React.useState("");
 const [desc,setDesc]=React.useState("");
 const [tags,setTags]=React.useState([]);
 const [cover,setCover]=React.useState(null);
 function toggleTag(t){ setTags(tags.includes(t)?tags.filter(x=>x!==t):[...tags,t]); }
 function uploadCover(e){ const f=e.target.files[0]; if(!f) return; const r=new FileReader(); r.onload=()=>setCover(r.result); r.readAsDataURL(f); }
 function submit(){ if(!title) return alert("Podaj tytuł"); onAdd({id:Date.now()+Math.random(),title,desc,tags,cover,chapters:[]}); setTitle(""); setDesc(""); setTags([]); setCover(null); }
 return e("div",{className:"card"},
  e("h3",null,"Dodaj serię"),
  e("input",{placeholder:"Tytuł", value:title, onChange:e=>setTitle(e.target.value)}),
  e("textarea",{placeholder:"Opis", value:desc, onChange:e=>setDesc(e.target.value)}),
  e("div",null,TAGS.map(t=>e("label",{key:t,style:{marginRight:"4px"}, title:t},
    e("input",{type:"checkbox", checked:tags.includes(t), onChange:()=>toggleTag(t)}),t
  ))),
  e("input",{type:"file", accept:"image/*", onChange:uploadCover}),
  cover && e("img",{src:cover, style:{width:"120px",marginTop:"4px"}}),
  e("button",{onClick:submit},"Dodaj serię")
 );
}

/* ===== ADD CHAPTER ===== */
function AddChapter({series,onAdd}){
 const [title,setTitle]=React.useState("");
 const [images,setImages]=React.useState([]);
 function handleUpload(e){ const files=[...e.target.files]; Promise.all(files.map(f=>new Promise(res=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.readAsDataURL(f); }))).then(imgs=>setImages(imgs)); }
 function submit(){ if(!title) return alert("Podaj tytuł rozdziału"); onAdd({id:Date.now()+Math.random(),title,images}); setTitle(""); setImages([]); }
 return e("div",{className:"card"},
  e("input",{placeholder:"Tytuł rozdziału", value:title, onChange:e=>setTitle(e.target.value)}),
  e("input",{type:"file", multiple:true, accept:"image/*", onChange:handleUpload}),
  images.map((img,i)=>e("img",{key:i,src:img, style:{width:"100px",margin:"2px"}})),
  e("button",{onClick:submit},"Dodaj rozdział")
 );
}

/* ===== TAG FILTER ===== */
function TagFilter({selectedTags,setSelectedTags}){
 function toggle(t){ setSelectedTags(selectedTags.includes(t)?selectedTags.filter(x=>x!==t):[...selectedTags,t]); }
 return e("div",{className:"card"},TAGS.map(t=>e("span",{key:t,className:"tag "+(selectedTags.includes(t)?"active":""),onClick:()=>toggle(t)},t)));
}

/* ===== LIBRARY ===== */
function Library(){
 if(!user) return null;
 const favSeries=(series||[]).filter(s=>favorites.includes(s.id));
 return e("div",{className:"card"},
  e("h3",null,"Biblioteka"),
  favSeries.map(s=>e("div",{key:s.id,className:"link",onClick:()=>{setActive(s);setView("series");}},s.title))
 );
}

/* ===== TAG CLOUD ===== */
function TagCloud(){
 const counts={};
 (series||[]).forEach(s=>{ (s.tags||[]).forEach(t=>{ counts[t]=(counts[t]||0)+1; }); });
 return e("div",{className:"card"},
  e("h3",null,"Chmura gatunków"),
  Object.entries(counts).sort((a,b)=>b[1]-a[1]).map(([t,c])=>
    e("span",{key:t,className:"tag "+(searchTags.includes(t)?"active":""), onClick:()=>{ setSearchTags(searchTags.includes(t)?searchTags.filter(x=>x!==t):[...searchTags,t]); }},`${t} (${c})`)
  )
 );
}

/* ===== HOME VIEW ===== */
function Home(){
 return e("div",null,
  e("input",{placeholder:"Szukaj...", value:search,onChange:e=>setSearch(e.target.value)}),
  e(TagFilter,{selectedTags:searchTags,setSelectedTags:setSearchTags}),
  e(TagCloud),
  isAdmin && e(AddSeriesForm,{onAdd:s=>setSeries([...series,s])}),
  e(Library),
  e("div",{className:"grid"}, filtered().map(s=>e("div",{key:s.id,className:"card"},
    s.cover && e("img",{src:s.cover,className:"cover",onClick:()=>{setActive(s);setView("series");}}),
    e("b",{onClick:()=>{setActive(s);setView("series");}},s.title)
  )))
 );
}

/* ===== SERIES VIEW ===== */
function SeriesView(){
 if(!active) return null;
 function addChapter(ch){ active.chapters.push(ch); setSeries([...series]); }
 return e("div",{className:"card"},
  e("h2",null,active.title),
  e("p",null,active.desc),
  active.tags.map(t=>e("span",{key:t,className:"tag"},t)),
  active.chapters.map(ch=>e("div",{key:ch.id},
    e("button",{onClick:()=>setReader(ch)},ch.title)
  )),
  isAdmin && e(AddChapter,{series:active,onAdd:addChapter})
 );
}

/* ===== LOGIN ===== */
function Login(){
 function login(){ const mail=prompt("Email:"); const pass=prompt("Hasło:"); if(mail===ADMIN.mail && pass===ADMIN.pass){ setUser({mail,name:"Admin"}); } else { setUser({mail,name:mail}); } }
 return e("div",{className:"card"}, e("button",{onClick:login},"Login"));
}

/* ===== READER ===== */
function Reader(){
 React.useEffect(()=>{ const el=document.querySelector(".readerOverlay"); enableFullscreen(el); enableSwipeClose(()=>setReader(null)); },[]);
 return e("div",{className:"readerOverlay "+(isMobile()?"mobileReader":"")},
  e("button",{onClick:()=>setReader(null),style:{position:"fixed",top:10,right:10,zIndex:1000}},"Zamknij"),
  e("div",{className:"reader"}, reader.images.map((img,i)=>e("img",{key:i,src:img})))
 );
}

/* ===== APP ===== */
return e("div",null,
 e("header",null,
  e("button",{onClick:()=>setView("home")},"Home"),
  e("button",{onClick:()=>setView("login")},"Login")
 ),
 view==="home"&&e(Home),
 view==="series"&&e(SeriesView),
 view==="login"&&e(Login),
 reader&&e(Reader)
);
}

ReactDOM.createRoot(document.getElementById("root")).render(e(App));
}
</script>
</body>
</html>
