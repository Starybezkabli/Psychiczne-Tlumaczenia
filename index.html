<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>Psychiczne tłumaczenia — Ultimate Reader+</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getDatabase, ref, set, onValue, push } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged, signOut } 
from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

const firebaseConfig={
 apiKey:"API_KEY",
 authDomain:"psychicznetlumaczenia-34d74.firebaseapp.com",
 projectId:"psychicznetlumaczenia-34d74",
 storageBucket:"psychicznetlumaczenia-34d74.appspot.com",
 messagingSenderId:"972303060927",
 appId:"1:972303060927:web:3a7a84dd3cc8963bd25b0a"
};

const app=initializeApp(firebaseConfig);
window.db=getDatabase(app);
window.dbRef=ref;
window.dbSet=set;
window.dbOn=onValue;
window.dbPush=push;
window.auth=getAuth(app);
window.firebaseReady=true;
</script>

<style>
body{margin:0;background:#0b0016;color:#e9d5ff;font-family:system-ui}
header{background:#2e1065;padding:10px;display:flex;gap:6px;flex-wrap:wrap}
.card{background:#1a0033;border:1px solid #5b21b6;padding:10px;border-radius:8px;margin:10px 0}
button{background:#6d28d9;color:white;border:none;padding:6px;border-radius:6px;cursor:pointer}
input,textarea{width:100%;margin:4px 0;background:#14002a;color:white;border:1px solid #5b21b6;padding:6px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.cover{width:100%;height:240px;object-fit:cover;border-radius:6px}
.tag{background:#3b0764;padding:4px;border-radius:6px;margin:2px;display:inline-block}
.readerOverlay{position:fixed;inset:0;background:black;overflow:hidden;z-index:999}
.reader img{width:100%;display:block}
.comment{background:#14002a;padding:6px;margin:4px 0;border-radius:6px}
</style>
</head>

<body>
<div id="root"></div>

<script>
function waitFirebase(cb){
 if(window.firebaseReady&&window.db)cb();
 else setTimeout(()=>waitFirebase(cb),50);
}
waitFirebase(startApp);

function startApp(){
const e=React.createElement;

/* ===== SAFE FIREBASE HOOK ===== */
function useDB(key,initial){
 const[data,setData]=React.useState(initial);
 const loaded=React.useRef(false);
 React.useEffect(()=>{
  const r=dbRef(db,key);
  dbOn(r,s=>{
   if(s.exists()) setData(s.val());
   else if(!loaded.current){ dbSet(r,initial); }
   loaded.current=true;
  });
 },[key]);
 const save=v=>{
  const val=typeof v==="function"?v(data):v;
  setData(val);
  dbSet(dbRef(db,key),val);
 };
 return[data,save];
}

/* ===== AUTH HOOK ===== */
function useAuth(){
 const[user,setUser]=React.useState(null);
 React.useEffect(()=>{
  onAuthStateChanged(auth,u=>setUser(u));
 },[]);
 return user;
}

/* ===== APP ===== */
function App(){
const [series,setSeries]=useDB("series",[]);
const [views,setViews]=useDB("views",{}); // statystyki
const user=useAuth();
const [view,setView]=React.useState("home");
const [active,setActive]=React.useState(null);
const [reader,setReader]=React.useState(null);
const [comments,setComments]=useDB("comments",{});

/* ===== STATS ===== */
function addView(id){
 setViews(v=>({...v,[id]:(v[id]||0)+1}));
}

/* ===== ADD SERIES ===== */
function addSeries(){
 const title=prompt("Tytuł:");
 if(!title)return;
 const obj={id:Date.now(),title,chapters:[]};
 setSeries(s=>[...s,obj]);
}

/* ===== ADD CHAPTER ===== */
function addChapter(s){
 const title=prompt("Rozdział:");
 if(!title)return;
 const ch={id:Date.now(),title,images:[]};
 s.chapters.push(ch);
 setSeries([...series]);
}

/* ===== READER ===== */
function Reader(){
 React.useEffect(()=>{
  const el=document.querySelector(".readerOverlay");
  el.requestFullscreen?.();
 },[]);
 return e("div",{className:"readerOverlay"},
  e("button",{onClick:()=>setReader(null)},"Zamknij"),
  e("div",{className:"reader",style:{overflowX:"auto",whiteSpace:"nowrap"}},
   reader.images.map((img,i)=>
    e("img",{key:i,src:img,style:{display:"inline-block",width:"100%"}})
   )
  ),
  e("h3",null,"Komentarze"),
  (comments[reader.id]||[]).map((c,i)=>
   e("div",{key:i,className:"comment"},c.user+": "+c.text)
  ),
  user&&e("div",null,
   e("input",{id:"com"}),
   e("button",{onClick:()=>{
    const text=document.getElementById("com").value;
    if(!text)return;
    const arr=comments[reader.id]||[];
    setComments({...comments,[reader.id]:[...arr,{user:user.email,text}]});
    document.getElementById("com").value="";
   }},"Dodaj komentarz")
  )
 );
}

/* ===== LOGIN ===== */
function Login(){
 return e("div",{className:"card"},
  e("input",{id:"mail",placeholder:"Email"}),
  e("input",{id:"pass",type:"password",placeholder:"Hasło"}),
  e("button",{onClick:()=>{
   const mail=document.getElementById("mail").value;
   const pass=document.getElementById("pass").value;
   createUserWithEmailAndPassword(auth,mail,pass)
   .catch(()=>signInWithEmailAndPassword(auth,mail,pass));
  }},"Zaloguj / Zarejestruj"),
  user&&e("button",{onClick:()=>signOut(auth)},"Wyloguj")
 );
}

/* ===== HOME ===== */
function Home(){
 const sorted=[...series].sort((a,b)=>(views[b.id]||0)-(views[a.id]||0));
 return e("div",null,
  user&&e("div",null,"Zalogowany: "+user.email),
  e("button",{onClick:addSeries},"Dodaj serię"),
  e("h3",null,"Najpopularniejsze"),
  sorted.map(s=>
   e("div",{key:s.id,className:"card"},
    e("b",{onClick:()=>{setActive(s);setView("series");addView(s.id);}},s.title),
    e("div",null,"Wyświetlenia: "+(views[s.id]||0))
   )
  )
 );
}

/* ===== SERIES ===== */
function Series(){
 if(!active)return null;
 return e("div",{className:"card"},
  e("h2",null,active.title),
  active.chapters.map(ch=>
   e("div",{key:ch.id},
    e("button",{onClick:()=>setReader(ch)},ch.title)
   )
  ),
  e("button",{onClick:()=>addChapter(active)},"Dodaj rozdział")
 );
}

return e("div",null,
 e("header",null,
  e("button",{onClick:()=>setView("home")},"Home"),
  e("button",{onClick:()=>setView("login")},"Login")
 ),
 view==="home"&&e(Home),
 view==="series"&&e(Series),
 view==="login"&&e(Login),
 reader&&e(Reader)
);
}

ReactDOM.createRoot(document.getElementById("root")).render(e(App));
}
</script>
</body>
</html>
